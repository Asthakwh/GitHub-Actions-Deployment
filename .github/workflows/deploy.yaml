name: Deploy to AWS Elastic Beanstalk

# Trigger the workflow when code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Use the latest version of Ubuntu as the virtual environment
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the code from the repository
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Set up Node.js environment
    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        # Specify the version of Node.js (version 14 in this case)
        node-version: '14'

    # Step 3: Install the project's dependencies listed in package.json
    - name: Install dependencies
      run: npm install

    # Step 4: Build the project (if applicable)
    - name: Run build
      run: npm run build

    # Step 5: Deploy the project to AWS Elastic Beanstalk
    - name: Deploy to AWS Elastic Beanstalk
      # Pass AWS credentials stored in GitHub Secrets as environment variables
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        # Initialize the Elastic Beanstalk application with Node.js platform
        eb init -p node.js my-app --region $AWS_REGION
        # Deploy the application to Elastic Beanstalk
        eb deploy
